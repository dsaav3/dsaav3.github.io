<svg viewBox="0 0 980 620" xmlns="http://www.w3.org/2000/svg" font-family="'IBM Plex Mono', 'Courier New', monospace">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#35E08A"/>
    </marker>
    <marker id="arrowDim" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#5A6E67"/>
    </marker>
  </defs>

  <rect width="980" height="620" fill="#0A0E0D"/>

  <!-- Core 1 zone -->
  <rect x="24" y="24" width="620" height="560" rx="10" fill="none" stroke="#1E2A26" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="44" y="54" fill="#35E08A" font-size="14" letter-spacing="2">CORE 1 — APP_CPU  ·  REAL-TIME PLANE</text>

  <!-- Core 0 zone -->
  <rect x="668" y="24" width="288" height="560" rx="10" fill="none" stroke="#1E2A26" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="688" y="54" fill="#E8A33D" font-size="14" letter-spacing="2">CORE 0 — PRO_CPU</text>
  <text x="688" y="72" fill="#8FA39B" font-size="11">observability plane</text>

  <!-- producer_task -->
  <rect x="60" y="96" width="190" height="64" rx="6" fill="#101614" stroke="#35E08A" stroke-width="1.5"/>
  <text x="155" y="122" fill="#E4ECE8" font-size="13" text-anchor="middle">producer_task</text>
  <text x="155" y="140" fill="#8FA39B" font-size="10.5" text-anchor="middle">20 Hz · builds ecg_sample_t</text>

  <!-- data_q -->
  <rect x="330" y="96" width="170" height="64" rx="6" fill="#101614" stroke="#4A5C56" stroke-width="1.5"/>
  <text x="415" y="120" fill="#E4ECE8" font-size="13" text-anchor="middle">data_q</text>
  <text x="415" y="138" fill="#8FA39B" font-size="10.5" text-anchor="middle">Queue · depth 20</text>
  <text x="415" y="152" fill="#8FA39B" font-size="10.5" text-anchor="middle">FIFO, ecg_sample_t</text>

  <!-- consumer_task -->
  <rect x="60" y="224" width="190" height="64" rx="6" fill="#101614" stroke="#35E08A" stroke-width="1.5"/>
  <text x="155" y="250" fill="#E4ECE8" font-size="13" text-anchor="middle">consumer_task</text>
  <text x="155" y="268" fill="#8FA39B" font-size="10.5" text-anchor="middle">arrhythmia check</text>

  <!-- evt_group -->
  <rect x="330" y="224" width="170" height="64" rx="6" fill="#101614" stroke="#4A5C56" stroke-width="1.5"/>
  <text x="415" y="248" fill="#E4ECE8" font-size="13" text-anchor="middle">evt_group</text>
  <text x="415" y="266" fill="#8FA39B" font-size="10.5" text-anchor="middle">PRODUCED | PROCESSED</text>

  <!-- coordinator_task -->
  <rect x="245" y="336" width="190" height="64" rx="6" fill="#101614" stroke="#35E08A" stroke-width="1.5"/>
  <text x="340" y="362" fill="#E4ECE8" font-size="13" text-anchor="middle">coordinator_task</text>
  <text x="340" y="380" fill="#8FA39B" font-size="10.5" text-anchor="middle">waits on BOTH bits</text>

  <!-- responder_task -->
  <rect x="245" y="452" width="190" height="64" rx="6" fill="#101614" stroke="#35E08A" stroke-width="1.5"/>
  <text x="340" y="478" fill="#E4ECE8" font-size="13" text-anchor="middle">responder_task</text>
  <text x="340" y="496" fill="#8FA39B" font-size="10.5" text-anchor="middle">alert dispatch</text>

  <!-- button ISR -->
  <rect x="60" y="452" width="150" height="64" rx="6" fill="#101614" stroke="#E2544A" stroke-width="1.5"/>
  <text x="135" y="476" fill="#E4ECE8" font-size="12.5" text-anchor="middle">button_isr</text>
  <text x="135" y="493" fill="#8FA39B" font-size="10" text-anchor="middle">GPIO18, IRAM_ATTR</text>

  <!-- telemetry store -->
  <rect x="60" y="336" width="150" height="64" rx="6" fill="#101614" stroke="#4A5C56" stroke-width="1.5"/>
  <text x="135" y="358" fill="#E4ECE8" font-size="11.5" text-anchor="middle">hb_prod / hb_cons</text>
  <text x="135" y="373" fill="#E4ECE8" font-size="11.5" text-anchor="middle">hb_coord / hb_resp</text>
  <text x="135" y="390" fill="#8FA39B" font-size="10" text-anchor="middle">shared telemetry</text>

  <!-- webmonitor_task -->
  <rect x="700" y="120" width="228" height="72" rx="6" fill="#101614" stroke="#E8A33D" stroke-width="1.5"/>
  <text x="814" y="146" fill="#E4ECE8" font-size="13" text-anchor="middle">webmonitor_task</text>
  <text x="814" y="164" fill="#8FA39B" font-size="10.5" text-anchor="middle">wifi_init_sta → httpd</text>
  <text x="814" y="180" fill="#8FA39B" font-size="10.5" text-anchor="middle">/  and  /state (JSON)</text>

  <!-- browser -->
  <rect x="700" y="252" width="228" height="56" rx="6" fill="#101614" stroke="#4A5C56" stroke-width="1.5"/>
  <text x="814" y="276" fill="#E4ECE8" font-size="12.5" text-anchor="middle">browser / dashboard</text>
  <text x="814" y="292" fill="#8FA39B" font-size="10" text-anchor="middle">polls /state @ ~1 Hz</text>

  <!-- Arrows: core 1 flow -->
  <path d="M250,128 L330,128" stroke="#35E08A" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>
  <text x="290" y="118" fill="#8FA39B" font-size="9.5" text-anchor="middle">xQueueSend</text>

  <path d="M415,160 L415,224" stroke="#4A5C56" stroke-width="1.5" marker-end="url(#arrowDim)" fill="none"/>
  <text x="470" y="196" fill="#8FA39B" font-size="9.5" text-anchor="middle">xQueueReceive</text>
  <path d="M330,256 L250,256" stroke="#35E08A" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>

  <path d="M155,160 Q155,196 330,242" stroke="#35E08A" stroke-width="1.3" stroke-dasharray="3 3" marker-end="url(#arrow)" fill="none"/>
  <text x="200" y="196" fill="#8FA39B" font-size="9">set EV_BIT_PRODUCED</text>

  <path d="M155,288 Q155,310 330,242" stroke="#35E08A" stroke-width="1.3" stroke-dasharray="3 3" marker-end="url(#arrow)" fill="none"/>
  <text x="190" y="310" fill="#8FA39B" font-size="9">set EV_BIT_PROCESSED</text>

  <path d="M400,288 Q365,310 355,336" stroke="#4A5C56" stroke-width="1.5" marker-end="url(#arrowDim)" fill="none"/>
  <text x="470" y="322" fill="#8FA39B" font-size="9.5" text-anchor="middle">wait ALL bits</text>

  <path d="M340,400 L340,452" stroke="#35E08A" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>
  <text x="410" y="430" fill="#8FA39B" font-size="9.5" text-anchor="middle">xTaskNotifyGive</text>

  <path d="M135,452 L280,404" stroke="#E2544A" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arrow)" fill="none"/>
  <text x="150" y="420" fill="#E2544A" font-size="9">vTaskNotifyGiveFromISR</text>

  <!-- telemetry writes (dotted, faint) -->
  <path d="M155,224 L135,400" stroke="#4A5C56" stroke-width="1" stroke-dasharray="2 3" fill="none"/>
  <path d="M340,336 L155,368" stroke="#4A5C56" stroke-width="1" stroke-dasharray="2 3" fill="none"/>
  <path d="M340,452 L200,380" stroke="#4A5C56" stroke-width="1" stroke-dasharray="2 3" fill="none"/>

  <!-- telemetry + queue/evt read across to Core 0 (dotted, read-only) -->
  <path d="M500,128 C600,128 640,150 700,150" stroke="#E8A33D" stroke-width="1.3" stroke-dasharray="2 3" fill="none" marker-end="url(#arrowDim)"/>
  <path d="M210,368 C560,420 620,180 700,158" stroke="#E8A33D" stroke-width="1.3" stroke-dasharray="2 3" fill="none" marker-end="url(#arrowDim)"/>
  <text x="600" y="108" fill="#8FA39B" font-size="9.5" text-anchor="middle">read-only: queue depth, bits, heartbeats</text>

  <!-- webmonitor -> browser -->
  <path d="M814,192 L814,252" stroke="#E8A33D" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>
  <text x="870" y="226" fill="#8FA39B" font-size="9.5" text-anchor="middle">HTTP</text>

  <!-- legend -->
  <text x="44" y="580" fill="#5A6E67" font-size="10">solid = data / control flow</text>
  <text x="44" y="596" fill="#5A6E67" font-size="10">dashed amber = read-only telemetry to Core 0</text>
  <text x="330" y="580" fill="#5A6E67" font-size="10">dashed red = interrupt-driven path</text>
</svg>
